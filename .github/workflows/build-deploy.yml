name: Build and Deploy

on:
  push:
    branches: [main, data]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: data, path: data }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            audit/package-lock.json
            site/package-lock.json
      - working-directory: audit
        run: npm ci
      - working-directory: site
        run: npm ci
      - working-directory: audit
        run: npm run build
      # site imports audit's compiled loader (audit/dist/registry.js), so audit must build first.
      - working-directory: site
        run: npm run build
        env:
          SITE_BASE: /
          SITE_URL: https://govwebsite.hashin.me
      - uses: actions/upload-pages-artifact@v3
        with: { path: site/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
