name: Build and Deploy

on:
  push:
    branches: [main, data]
  # uptime.yml/audit.yml push to `data`, and report.yml pushes to `main`, all using the default
  # GITHUB_TOKEN -- pushes made with that token never trigger other workflows' `push` events
  # (GitHub's anti-recursion rule), so a bot commit would otherwise never rebuild Pages.
  # workflow_run isn't a push event and isn't subject to that rule, so it's the trigger that
  # actually fires for those commits. squash-data.yml isn't listed: it only rewrites `data`'s
  # history, never its content, so there's nothing new to deploy.
  workflow_run:
    workflows: ['Uptime (light checks)', 'Deep audit (rolling)', 'Monthly report']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: data, path: data }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            audit/package-lock.json
            site/package-lock.json
      - working-directory: audit
        run: npm ci
      - working-directory: site
        run: npm ci
      - working-directory: audit
        run: npm run build
      # site imports audit's compiled loader (audit/dist/registry.js), so audit must build first.
      - working-directory: site
        run: npm run build
        env:
          SITE_BASE: /
          SITE_URL: https://govwebsite.hashin.me
      - uses: actions/upload-pages-artifact@v3
        with: { path: site/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
