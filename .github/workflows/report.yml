name: Monthly report

on:
  schedule:
    - cron: '10 0 1 * *'           # 1st of the month, 00:10 UTC / 05:40 IST
  workflow_dispatch:
    inputs:
      month:
        description: 'Override the report month (YYYY-MM), for a re-run or a backfill'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: data, path: data }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: audit/package-lock.json
      - working-directory: audit
        run: npm ci
      - working-directory: audit
        run: npm run build
      - run: >
          node audit/dist/cli.js report
          --registry registry --data data --out site/src/content/reports
          --month "${{ inputs.month }}"
      - name: Commit report
        run: |
          git config user.name  "kerala-web-watch[bot]"
          git config user.email "kerala-web-watch[bot]@users.noreply.github.com"
          git add site/src/content/reports
          git commit -m "docs: monthly report $(date -u +%Y-%m)" || exit 0
          git push
