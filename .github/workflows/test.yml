name: Test

on:
  push:
    branches: [main]
    paths: ['audit/**', 'site/**', '.github/workflows/test.yml']
  pull_request:
    paths: ['audit/**', 'site/**', '.github/workflows/test.yml']

# One job per target (see CLAUDE.md Build & test). Each is skipped until its package exists (Phase 0).
jobs:
  audit:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: audit } }
    steps:
      - uses: actions/checkout@v4
      - id: exists
        run: test -f package.json && echo "yes=true" >> "$GITHUB_OUTPUT" || echo "yes=false" >> "$GITHUB_OUTPUT"
      - if: steps.exists.outputs.yes == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: audit/package-lock.json }
      - if: steps.exists.outputs.yes == 'true'
        run: npm ci
      - if: steps.exists.outputs.yes == 'true'
        run: npm run lint --if-present
      - if: steps.exists.outputs.yes == 'true'
        run: npm test
      - if: steps.exists.outputs.yes == 'true'
        run: npm run build
      # WP3.5: the fixture-server smoke test (`self-test`) drives a real Chromium, so it needs the
      # actual browser binary -- `npx playwright install` alone (as used locally) skips the OS-level
      # deps a fresh CI runner doesn't already have; `--with-deps` installs both in one step.
      - if: steps.exists.outputs.yes == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.exists.outputs.yes == 'true'
        run: npm run self-test

  site:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: site } }
    steps:
      - uses: actions/checkout@v4
      - id: exists
        run: test -f package.json && echo "yes=true" >> "$GITHUB_OUTPUT" || echo "yes=false" >> "$GITHUB_OUTPUT"
      - if: steps.exists.outputs.yes == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: site/package-lock.json }
      - if: steps.exists.outputs.yes == 'true'
        run: npm ci
      - if: steps.exists.outputs.yes == 'true'
        run: npm run lint --if-present
      - if: steps.exists.outputs.yes == 'true'
        run: npm test --if-present
      - if: steps.exists.outputs.yes == 'true'
        run: npm run build
