name: Uptime (light checks)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Only check the first N sites (leave empty for all)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  light:
    runs-on: ubuntu-latest
    # The CLI stops starting new sites at 40 min (--deadline-minutes) and the slowest in-flight site
    # takes ~2 min (DNS + 3 GET attempts + redirect probe), so 50 leaves room to write and commit.
    # At 30 with no deadline, a flaky-DNS morning timed the job out with nothing committed (Oct 2026).
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: data, path: data }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: audit/package-lock.json
      - working-directory: audit
        run: npm ci
      - working-directory: audit
        run: npm run build
      - run: >
          node audit/dist/cli.js light --all --data data --registry registry
          --limit "${{ inputs.limit }}" --deadline-minutes 40
        env:
          VANTAGE: gh-us
          # dns.lookup() runs getaddrinfo on libuv's threadpool (default 4 threads). Each site does
          # an A and an AAAA lookup, so 6 concurrent sites queue behind 4 threads, and a lookup that
          # fails slowly (~20 s) blocks a thread the whole time. 16 keeps all 12 lookups in flight.
          UV_THREADPOOL_SIZE: 16
      - name: Commit results
        working-directory: data
        run: |
          git config user.name  "kerala-web-watch[bot]"
          git config user.email "kerala-web-watch[bot]@users.noreply.github.com"
          git add -A
          git commit -m "uptime: $(date -u +%FT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do
            git push && break
            git pull --rebase && sleep $((i * 5))
          done

  # DESIGN §6.7 / WP4.7: needs a self-hosted runner labelled `india` (a throwaway box holding no
  # secrets) and the repo variable HAS_INDIA_RUNNER=true; otherwise this job never starts and
  # geo-blocked sites simply stay `unverifiable`.
  light-india:
    needs: light
    if: ${{ vars.HAS_INDIA_RUNNER == 'true' }}
    runs-on: [self-hosted, india]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { ref: data, path: data }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: audit/package-lock.json
      - working-directory: audit
        run: npm ci
      - working-directory: audit
        run: npm run build
      - run: >
          node audit/dist/cli.js light --unverifiable --data data --registry registry
          --vantage in-1 --deadline-minutes 25
        env:
          UV_THREADPOOL_SIZE: 16
      - name: Commit results
        working-directory: data
        run: |
          git config user.name  "kerala-web-watch[bot]"
          git config user.email "kerala-web-watch[bot]@users.noreply.github.com"
          git add -A
          git commit -m "uptime (india): $(date -u +%FT%H:%MZ)" || exit 0
          for i in 1 2 3 4 5; do
            git push && break
            git pull --rebase && sleep $((i * 5))
          done
