# Portfolio -> departments. Kept separate from departments.yaml because the cabinet changes every
# election while the site-to-department link (departments.yaml) does not (ADR-014).
# `holder` and each portfolio's `departments` list are left for the human to fill in; the departments
# named per portfolio here are placeholders using kerala.gov.in's usual grouping and must be confirmed.
