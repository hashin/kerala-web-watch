# The 14 district collectorate portals. DESIGN.md Appendix A guessed these urls from memory
# (its own caption said so); the real ones, confirmed live during WP1.5, differ for three of the
# 14 -- thiruvananthapuram.nic.in doesn't resolve (the real host is trivandrum.nic.in, the
# historical English name), kasaragod.nic.in doesn't resolve (real host: kasargod.nic.in), and
# wayanad.nic.in 301-redirects permanently to wayanad.gov.in, a differently-templated site (not
# S3WaaS) -- used as the canonical url instead of the redirect.
